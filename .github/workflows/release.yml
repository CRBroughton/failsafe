name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: devenv shell -- pnpm install --frozen-lockfile

      - name: Test
        run: devenv shell -- pnpm exec nx run failsafe:test

      - name: Build
        run: devenv shell -- pnpm exec nx run failsafe:build

      - name: Debug OIDC env
        run: |
          echo "outer shell: ACTIONS_ID_TOKEN_REQUEST_URL set = ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "outer shell: ACTIONS_ID_TOKEN_REQUEST_TOKEN set = ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          devenv shell -- sh -c 'echo "devenv shell: ACTIONS_ID_TOKEN_REQUEST_URL set = ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"'
          devenv shell -- sh -c 'echo "devenv shell: ACTIONS_ID_TOKEN_REQUEST_TOKEN set = ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"'
          devenv shell -- npm --version

      - name: Publish to npm
        run: devenv shell -- npm publish --access public
